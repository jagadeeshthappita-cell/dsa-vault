<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA Vault</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{--bg:#fff;--sb:#F7F7F8;--t:#202123;--t2:#6B7280;--bd:#E5E7EB;--card:#fff;--btn:#000;--btnt:#fff;--hv:#F0F0F1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#171717;--sb:#202020;--t:#fff;--t2:#A3A3A3;--bd:#333;--card:#262626;--btn:#fff;--btnt:#000;--hv:#2e2e2e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#171717;--sb:#202020;--t:#fff;--t2:#A3A3A3;--bd:#333;--card:#262626;--btn:#fff;--btnt:#000;--hv:#2e2e2e}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:14px/1.55 Inter,system-ui,sans-serif;transition:background .2s,color .2s}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;height:100%}
aside{width:250px;background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px 10px;flex:none;transition:transform .2s}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;padding:6px 10px 16px}
.logo b{background:var(--btn);color:var(--btnt);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;color:var(--t);transition:background .15s}
.nav:hover,.nav.on{background:var(--hv)}.nav.on{font-weight:600}.nav span{margin-left:auto;color:var(--t2);font-size:12px}
.prof{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--bd)}
.av{width:30px;height:30px;border-radius:50%;background:var(--btn);color:var(--btnt);display:grid;place-items:center;font-size:12px;font-weight:600}
.prof small{display:block;color:var(--t2);font-size:12px}
main{flex:1;overflow:auto;min-width:0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;padding:12px 28px}
.sr{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;background:var(--card);color:var(--t2)}
.sr input{border:0;outline:0;background:none;color:var(--t);padding:9px 0;width:100%;font:inherit}
.wrap{padding:28px;max-width:1080px;margin:0 auto}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px;font-weight:600}h2{font-size:16px;margin:28px 0 12px;font-weight:600}
.sub{color:var(--t2);margin:0 0 24px}
.btn{background:var(--btn);color:var(--btnt);border:1px solid var(--btn);border-radius:9px;padding:8px 14px;display:inline-flex;gap:7px;align-items:center;font-weight:500;white-space:nowrap}
.btn.o{background:none;color:var(--t);border-color:var(--bd)}.btn.o:hover{background:var(--hv)}.btn:hover{opacity:.88}
.ib{border:0;background:none;padding:6px;border-radius:7px;color:var(--t2);display:inline-flex}.ib:hover{background:var(--hv);color:var(--t)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;transition:border-color .15s}
.card.h{cursor:pointer}.card.h:hover{border-color:var(--t2)}.card.over{border-color:var(--t);border-style:dashed}
.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em}.stat{color:var(--t2)}
.fc{display:flex;align-items:center;gap:12px}.fc div{min-width:0;flex:1}.fc strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fc small{color:var(--t2)}
.fc .acts{opacity:0;flex:none;display:flex}.card:hover .acts{opacity:1}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin-bottom:8px;cursor:pointer}
.row:hover{border-color:var(--t2)}.row.drag{opacity:.4}.row.over{border-top:2px solid var(--t)}
.row .m{flex:1;min-width:0}.row .m strong{display:block}.row small{color:var(--t2)}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:0 9px;font-size:12px;color:var(--t2);margin-right:4px}
.tag.d{color:var(--t);border-color:var(--t)}
.chips{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.chip{border:1px solid var(--bd);background:none;border-radius:20px;padding:4px 13px}.chip.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
label{display:block;font-weight:500;margin:12px 0 5px;font-size:13px}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--bd);border-radius:9px;padding:9px 11px;background:var(--card);color:var(--t);font:inherit;outline:0}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--t2)}textarea.f{resize:none;overflow:hidden;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{border:1px solid var(--bd);border-radius:12px;padding:6px 20px 20px;margin-bottom:16px;background:var(--card)}
.sec h3{margin:16px 0 0;font-size:15px}
.bar{height:8px;background:var(--hv);border-radius:6px;overflow:hidden;display:flex}.bar i{background:var(--t);display:block;height:100%}
.br{display:grid;grid-template-columns:150px 1fr 30px;gap:10px;align-items:center;margin:7px 0}
.ce{display:grid;border:1px solid var(--bd);border-radius:9px;overflow-x:auto;background:var(--sb)}
.ce pre,.ce textarea{grid-area:1/1;margin:0;padding:12px 14px;font:13px/1.6 'JetBrains Mono',ui-monospace,monospace;white-space:pre;tab-size:4;border:0;outline:0;min-width:0}
.ce pre{pointer-events:none;color:var(--t)}.ce textarea{background:none;color:transparent;caret-color:var(--t);resize:none;overflow:hidden;width:100%}
.hljs-keyword,.hljs-built_in,.hljs-type{font-weight:700}.hljs-comment{color:var(--t2);font-style:italic}.hljs-string,.hljs-number,.hljs-literal{color:var(--t2)}.hljs-title{text-decoration:underline;text-decoration-color:var(--t2)}
.ch{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:16px}
.md{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:22px;width:100%;max-width:560px;max-height:90vh;overflow:auto;animation:pop .15s}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.md h3{margin:0 0 4px;font-size:18px}.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:40}
.ts{background:var(--btn);color:var(--btnt);padding:9px 16px;border-radius:9px;animation:pop .15s}
.empty{text-align:center;padding:48px 16px;color:var(--t2);border:1px dashed var(--bd);border-radius:12px}.empty strong{display:block;color:var(--t);margin-bottom:4px}
.back{display:inline-flex;gap:4px;align-items:center;border:0;background:none;color:var(--t2);padding:0;margin-bottom:12px}
.mb{display:none}
.stbtn.on{background:var(--btn);color:var(--btnt)}
:focus-visible{outline:2px solid var(--t2);outline-offset:2px}
@media(max-width:820px){aside{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%)}aside.open{transform:none}.mb{display:inline-flex}.top{padding:10px 14px}.wrap{padding:18px 14px}.two{grid-template-columns:1fr}.br{grid-template-columns:100px 1fr 24px}.fc .acts{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"><aside id="sb"></aside><main id="main"></main></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),KEY='dsavault:v1';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P='M3 10.5 12 3l9 7.5V21H3z|M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z|M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01|M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2|M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5|M6 3h12v18l-6-4-6 4z|M4 20V10M10 20V4M16 20v-8M22 20H2|M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2|M12 5v14M5 12h14|M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5|M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14|M12 20h9M16.5 3.5l4 4L8 20l-5 1 1-5z|M9 9h12v12H9zM5 15V5a2 2 0 0 1 2-2h8|M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z|M3 6h18M3 12h18M3 18h18|M15 18l-6-6 6-6'.split('|');
const IC=['home','folder','list','clock','refresh','bm','chart','gear','plus','search','trash','edit','copy','moon','menu','back'];
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[IC.indexOf(n)]}"/></svg>`;
const PAT=['Arrays','Strings','Hashing','Two Pointers','Sliding Window','Prefix Sum','Binary Search','Sorting','Linked Lists','Stacks','Queues','Recursion','Backtracking','Trees','Binary Search Trees','Heaps and Priority Queues','Greedy Algorithms','Dynamic Programming','Graphs','Tries','Bit Manipulation','Advanced Patterns'];
const LANG={Python:'python',Java:'java','C++':'cpp',JavaScript:'javascript'},PLAT=['LeetCode','GeeksforGeeks','CodeStudio','HackerRank','Other'],DIFF=['Easy','Medium','Hard'];
const ST={new:'Not reviewed',understood:'Understood',revise:'Needs revision',mastered:'Mastered'};
let S,view={n:'dash'},q='',df='',mem=0;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.folders)S={
  folders:PAT.map((n,i)=>({id:'f'+i,name:n})),
  problems:[],
  theme:'auto',
  name:'Thappita Jagadeesh'
};
const SB_URL='https://nvtaatwjgebdemufvcxv.supabase.co';
const SB_KEY='sb_publishable_M3RLIyYa3RdjaEkvssbIog_JfPJc3Ma';
let sb=null,user=null,pt;
if(SB_URL&&SB_KEY&&window.supabase)sb=supabase.createClient(SB_URL,SB_KEY);
function setStat(m){window.syncMsg=m;const e=document.querySelector('.prof small');if(e)e.textContent=m}
function push(){if(!sb||!user)return;clearTimeout(pt);setStat('Syncing...');pt=setTimeout(async()=>{const{error}=await sb.from('vault').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});setStat(error?'Sync failed':'Synced')},800)}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fname=id=>(S.folders.find(f=>f.id===id)||{name:'Unfiled'}).name;
const byId=id=>S.problems.find(p=>p.id===id);
function toast(m){const t=document.createElement('div');t.className='ts';t.textContent=m;$('#toast').append(t);setTimeout(()=>t.remove(),2200)}
function theme(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=S.theme}
function modal(html){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md">${html}</div>`;o.onclick=e=>{if(e.target===o||e.target.closest('[data-x]'))o.remove()};document.body.append(o);const i=o.querySelector('input,select');i&&i.focus();return o}
function confirmBox(msg,fn){const o=modal(`<h3>Are you sure?</h3><p class="sub" style="margin:6px 0 0">${msg}</p><div class="ma"><button class="btn o" data-x>Cancel</button><button class="btn" id="ok">Delete</button></div>`);o.querySelector('#ok').onclick=()=>{o.remove();fn()}}
const go=(n,id)=>{view={n,id};$('#sb').classList.remove('open');render();$('#main').scrollTop=0};
const list=(n)=>n==='recent'?[...S.problems].sort((a,b)=>b.created-a.created):n==='revise'?S.problems.filter(p=>p.status==='revise'):n==='bm'?S.problems.filter(p=>p.bm):n==='folder'?S.problems.filter(p=>p.folder===view.id):S.problems;
const match=p=>{const s=q.toLowerCase();return(!df||p.diff===df)&&(!s||[p.name,p.qno,fname(p.folder),p.platform,p.diff,...(p.tags||[])].join(' ').toLowerCase().includes(s))};
function sidebar(){const N=[['dash','Dashboard','home'],['patterns','All Patterns','folder'],['problems','All Problems','list'],['recent','Recently Added','clock'],['revise','Revision List','refresh'],['bm','Bookmarks','bm'],['progress','Progress','chart'],['settings','Settings','gear']];
const c={problems:S.problems.length,revise:S.problems.filter(p=>p.status==='revise').length,bm:S.problems.filter(p=>p.bm).length};
const nm=S.name||'You';$('#sb').innerHTML=`<div class="logo"><b>DV</b>DSA Vault</div>`+N.map(([k,l,i])=>`<button class="nav ${view.n===k?'on':''}" data-a="go" data-n="${k}">${ic(i)}${l}${c[k]?`<span>${c[k]}</span>`:''}</button>`).join('')+`<div class="prof"><div class="av">${esc(nm.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase())}</div><div><strong>${esc(nm)}</strong><small>${window.syncMsg||(user&&user.email)||'Personal vault'}</small></div></div>`}
const diffTag=d=>`<span class="tag d">${esc(d)}</span>`;
function prow(p){return `<div class="row" draggable="true" data-id="${p.id}" data-a="open"><div class="m"><strong>${esc(p.name||'Untitled')}</strong><small>${esc(p.platform)}${p.qno?' #'+esc(p.qno):''} &middot; ${esc(fname(p.folder))}</small>${(p.tags||[]).length?'<div style="margin-top:4px">'+p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')+'</div>':''}</div>${diffTag(p.diff)}<span class="tag">${ST[p.status]}</span><button class="ib" data-a="bm" data-id="${p.id}" title="Bookmark" style="${p.bm?'color:var(--t)':''}">${ic('bm')}</button></div>`}
const empty=(t,s)=>`<div class="empty"><strong>${t}</strong>${s}</div>`;
function plist(items,ed){const r=items.filter(match);const chips=`<div class="chips">${['',...DIFF].map(d=>`<button class="chip ${df===d?'on':''}" data-a="df" data-d="${d}">${d||'All'}</button>`).join('')}</div>`;
return chips+(r.length?r.map(prow).join(''):empty(S.problems.length?'No matching problems':'No problems yet','Use Add New Problem to save your first solution.'))}
function stat(l,v){return `<div class="card stat"><b>${v}</b>${l}</div>`}
function pform(p,fid){p=p||{};const o=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
return `<h3>${p.id?'Edit problem':'Add new problem'}</h3><form id="pf"><label>Problem name</label><input class="f" name="name" required value="${esc(p.name)}">
<div class="two"><div><label>Platform</label><select class="f" name="platform">${o(PLAT,p.platform)}</select></div><div><label>Original question number</label><input class="f" name="qno" value="${esc(p.qno)}"></div></div>
<label>Problem URL</label><input class="f" name="url" type="url" value="${esc(p.url)}" placeholder="https://">
<div class="two"><div><label>Difficulty</label><select class="f" name="diff">${o(DIFF,p.diff||'Medium')}</select></div><div><label>Pattern folder</label><select class="f" name="folder">${S.folders.map(f=>`<option value="${f.id}" ${f.id===(p.folder||fid)?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div></div>
<label>Additional tags (comma separated)</label><input class="f" name="tags" value="${esc((p.tags||[]).join(', '))}">
<label>Problem statement</label><textarea class="f" name="statement" rows="4">${esc(p.statement)}</textarea>
<label>Input and output examples</label><textarea class="f" name="examples" rows="3">${esc(p.examples)}</textarea>
<div class="ma"><button type="button" class="btn o" data-x>Cancel</button><button class="btn">Save problem</button></div></form>`}
function openPform(p,fid){const o=modal(pform(p,fid));o.querySelector('#pf').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.tags=d.tags.split(',').map(t=>t.trim()).filter(Boolean);
if(p){Object.assign(p,d);toast('Changes saved')}else{S.problems.push({id:uid(),created:Date.now(),status:'new',history:[],bm:0,obs:'',bf:{},bt:{},op:{},lr:{},...d});toast('Problem saved')}
save();o.remove();p?render():go('folder',d.folder)}}
function fform(f){const o=modal(`<h3>${f?'Rename folder':'New folder'}</h3><form id="ff"><label>Folder name</label><input class="f" name="n" required value="${esc(f&&f.name)}"><div class="ma"><button type="button" class="btn o" data-x>Cancel</button><button class="btn">Save</button></div></form>`);
o.querySelector('#ff').onsubmit=e=>{e.preventDefault();const n=e.target.n.value.trim();f?f.name=n:S.folders.push({id:uid(),name:n});save();o.remove();toast(f?'Folder renamed':'Folder created');render()}}
function folders(){return S.folders.length?`<div class="grid">${S.folders.map(f=>`<div class="card h" data-a="folder" data-id="${f.id}"><div class="fc">${ic('folder')}<div><strong>${esc(f.name)}</strong><small>${S.problems.filter(p=>p.folder===f.id).length} problems</small></div><span class="acts"><button class="ib" data-a="renf" data-id="${f.id}" title="Rename">${ic('edit')}</button><button class="ib" data-a="delf" data-id="${f.id}" title="Delete">${ic('trash')}</button></span></div></div>`).join('')}</div>`:empty('No folders','Create a folder to start organizing.')}
const ta=(p,path,l,r)=>`<label>${l}</label><textarea class="f" data-f="${path}" rows="${r||3}">${esc(path.split('.').reduce((o,k)=>o?.[k],p))}</textarea>`;
const ln=(p,path)=>`<div class="two"><div><label>Time complexity</label><input class="f" data-f="${path}.tc" value="${esc(path.split('.').reduce((o,k)=>o?.[k],p)?.tc)}" placeholder="O(n)"></div><div><label>Space complexity</label><input class="f" data-f="${path}.sc" value="${esc(path.split('.').reduce((o,k)=>o?.[k],p)?.sc)}" placeholder="O(1)"></div></div>`;
function code(p,path){const o=path.split('.').reduce((a,k)=>a[k]=a[k]||{},p);const lg=o.lang||'Python';return `<div class="ch"><label style="margin:0">Code</label><span><select class="f" data-f="${path}.lang" style="width:auto;padding:4px 8px">${Object.keys(LANG).map(l=>`<option ${l===lg?'selected':''}>${l}</option>`).join('')}</select> <button class="btn o" style="padding:4px 10px" data-a="copy" data-path="${path}">${ic('copy')}Copy</button></span></div><div class="ce"><pre><code></code></pre><textarea data-f="${path}.code" data-code="1" spellcheck="false" autocapitalize="off" rows="6">${esc(o.code)}</textarea></div>`}
function notebook(p){const b=(t,x)=>`<div class="sec"><h3>${t}</h3>${x}</div>`;
return `<button class="back" data-a="folder" data-id="${p.folder}">${ic('back')}${esc(fname(p.folder))}</button>
<div style="display:flex;gap:10px;align-items:start"><div style="flex:1"><h1>${esc(p.name)}</h1><div class="sub">Changes save automatically <span id="sv"></span></div></div><button class="btn o" data-a="editp" data-id="${p.id}">${ic('edit')}Edit details</button><button class="btn o" data-a="delp" data-id="${p.id}">${ic('trash')}Delete</button></div>
${b('Problem information',`<div style="margin-top:10px">${esc(p.platform)}${p.qno?' #'+esc(p.qno):''} &middot; ${diffTag(p.diff)} &middot; ${esc(fname(p.folder))}${p.url?` &middot; <a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:var(--t)">Open problem</a>`:''}${(p.tags||[]).length?'<div style="margin-top:8px">'+p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')+'</div>':''}</div>`)}
${b('Problem understanding',ta(p,'statement','Problem statement',4)+ta(p,'examples','Examples',3)+ta(p,'obs','My observations',3))}
${b('Brute force approach',ta(p,'bf.exp','Explanation')+ta(p,'bf.steps','Algorithm steps')+code(p,'bf')+ln(p,'bf')+ta(p,'bf.lim','Limitations',2))}
${b('Better approach',ta(p,'bt.exp','Explanation')+code(p,'bt')+ln(p,'bt'))}
${b('Optimal approach',ta(p,'op.exp','Explanation')+ta(p,'op.steps','Algorithm steps')+code(p,'op')+ln(p,'op')+ta(p,'op.why','Why this is optimal',2))}
${b('Key learnings',ta(p,'lr.obs','Important observations')+ta(p,'lr.pat','Pattern recognition')+ta(p,'lr.mist','Common mistakes')+ta(p,'lr.tips','Interview tips'))}
${b('Revision tracking',`<div class="chips" style="margin-top:12px">${Object.entries(ST).filter(e=>e[0]!=='new').map(([k,l])=>`<button class="chip stbtn ${p.status===k?'on':''}" data-a="status" data-id="${p.id}" data-s="${k}">${k==='understood'?'Mark as understood':k==='revise'?'Mark for revision':'Mark as mastered'}</button>`).join('')}</div><label>History</label>${(p.history||[]).length?[...p.history].reverse().map(h=>`<div><small style="color:var(--t2)">${new Date(h.t).toLocaleString()}</small> &nbsp;${ST[h.s]}</div>`).join(''):'<small style="color:var(--t2)">No revisions logged yet.</small>'}`)}`}
function bars(rows,max){return rows.map(([l,v])=>`<div class="br"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l)}</span><div class="bar"><i style="width:${max?v/max*100:0}%"></i></div><span>${v}</span></div>`).join('')}
function progress(){const n=S.problems.length,pc=S.folders.map(f=>[f.name,S.problems.filter(p=>p.folder===f.id).length]).sort((a,b)=>b[1]-a[1]);
const dc=DIFF.map(d=>[d,S.problems.filter(p=>p.diff===d).length]),sc=Object.entries(ST).map(([k,l])=>[l,S.problems.filter(p=>p.status===k).length]);
if(!n)return empty('Nothing to measure yet','Add problems and your statistics appear here.');
return `<div class="grid" style="margin-bottom:8px">${stat('Total problems',n)}${stat('Pending revision',sc[2][1])}${stat('Mastered',sc[3][1])}</div><div class="two"><div class="card"><h2 style="margin-top:0">Difficulty</h2>${bars(dc,n)}</div><div class="card"><h2 style="margin-top:0">Status</h2>${bars(sc,n)}</div></div><div class="card" style="margin-top:12px"><h2 style="margin-top:0">By pattern</h2>${bars(pc.filter(x=>x[1]),pc[0][1])||''}</div><h2>Recently added</h2>${[...S.problems].sort((a,b)=>b.created-a.created).slice(0,5).map(prow).join('')}`}
function render(){sidebar();const m=$('#main'),n=view.n,add=`<button class="btn" data-a="newp">${ic('plus')}Add New Problem</button>`;let h='';
const T={patterns:'All Patterns',problems:'All Problems',recent:'Recently Added',revise:'Revision List',bm:'Bookmarks',progress:'Progress',settings:'Settings'};
if(n==='dash'){const rv=S.problems.filter(p=>p.status==='revise').length;h=`<h1>Your DSA Knowledge, Organized.</h1><p class="sub">One place for every problem, pattern and optimized solution.</p><div class="grid">${stat('Total problems',S.problems.length)}${stat('Total patterns',S.folders.length)}${stat('Problems to revise',rv)}${stat('Mastered',S.problems.filter(p=>p.status==='mastered').length)}</div><h2>Recently added</h2>${S.problems.length?list('recent').slice(0,5).map(prow).join(''):empty('Your vault is empty','Add a problem you solved today and file it under its pattern.')}<h2>Pattern folders</h2>${folders()}`}
else if(n==='patterns')h=`<div style="display:flex;align-items:center"><h1 style="flex:1">All Patterns</h1><button class="btn o" data-a="newf">${ic('plus')}New folder</button></div><p class="sub">Open a folder, or drag a problem onto one to move it.</p>${folders()}`;
else if(n==='folder'){const f=S.folders.find(x=>x.id===view.id);if(!f){view={n:'patterns'};return render()}h=`<button class="back" data-a="go" data-n="patterns">${ic('back')}All Patterns</button><div style="display:flex;align-items:center;gap:8px"><h1 style="flex:1">${esc(f.name)}</h1><button class="ib" data-a="renf" data-id="${f.id}">${ic('edit')}</button><button class="ib" data-a="delf" data-id="${f.id}">${ic('trash')}</button></div><p class="sub">Drag rows to arrange them in your own order.</p>${plist(list('folder'))}`}
else if(n==='progress')h=`<h1>Progress</h1><p class="sub">Calculated from your saved problems.</p>${progress()}`;
else if(n==='settings')h=`<h1>Settings</h1><p class="sub">Theme, profile and backup.</p><div class="card"><label style="margin-top:0">Your name</label><input class="f" data-s="name" value="${esc(S.name)}"><label>Theme</label><select class="f" data-s="theme">${['auto','light','dark'].map(t=>`<option ${S.theme===t?'selected':''}>${t}</option>`).join('')}</select></div><h2>Backup</h2><div class="card"><p style="margin-top:0;color:var(--t2)">Data lives in this browser. Export a JSON file regularly, and restore it anywhere.</p><button class="btn" data-a="export">Export JSON</button> <button class="btn o" data-a="import">Import JSON</button> <button class="btn o" data-a="reset">Erase everything</button> ${sb?'<button class="btn o" data-a="logout">Sign out</button>':''}</div>`;
else if(n==='open'){const p=byId(view.id);if(!p){view={n:'dash'};return render()}h=notebook(p)}
else h=`<h1>${T[n]}</h1><p class="sub">${S.problems.length} problems saved</p>${plist(list(n))}`;
m.innerHTML=`<div class="top"><button class="ib mb" data-a="menu">${ic('menu')}</button><div class="sr">${ic('search')}<input id="q" placeholder="Search name, number, pattern, platform, tag" value="${esc(q)}"></div>${add}</div><div class="wrap">${h}</div>`;
if(n==='open')m.querySelectorAll('[data-f]').forEach(fit)}
function hl(t){const o=t.closest('.ce'),c=o.querySelector('code'),lg=LANG[t.closest('.sec').querySelector('select[data-f$=".lang"]')?.value]||'python';let v=t.value;try{c.innerHTML=window.hljs?hljs.highlight(v,{language:lg}).value+'\n':esc(v)+'\n'}catch(e){c.textContent=v+'\n'}}
function fit(t){if(t.tagName==='TEXTAREA'){t.style.height='auto';t.style.height=Math.max(t.scrollHeight,t.dataset.code?100:70)+'px'}if(t.dataset.code)hl(t)}
function setPath(p,path,v){const k=path.split('.');let o=p;k.slice(0,-1).forEach(x=>o=o[x]=o[x]||{});o[k.at(-1)]=v}
let tm;document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){q=t.value;if(!['problems','folder','recent','revise','bm'].includes(view.n)&&q){view={n:'problems'};render();const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)}else if(view.n!=='dash'||q)refreshList();return}
if(t.dataset.s){S[t.dataset.s]=t.value;save();if(t.dataset.s==='theme')theme();sidebar();return}
if(t.dataset.f){setPath(byId(view.id),t.dataset.f,t.value);fit(t);if(t.dataset.f.endsWith('.lang'))t.closest('.sec').querySelectorAll('[data-code]').forEach(hl);const s=$('#sv');if(s)s.textContent='Saving...';clearTimeout(tm);tm=setTimeout(()=>{save();if(s)s.textContent='Saved'},400)}});
function refreshList(){const w=document.querySelector('.wrap'),h=w.querySelector('.chips');if(!h)return;let n=view.n;let nx=h.nextElementSibling;while(nx&&nx.classList.contains('row')||nx&&nx.classList.contains('empty')){const d=nx;nx=nx.nextElementSibling;d.remove()}const r=list(n).filter(match);h.insertAdjacentHTML('afterend',r.length?r.map(prow).join(''):empty('No matching problems','Try a different search or filter.'))}
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&e.target.dataset?.code){e.preventDefault();const t=e.target,s=t.selectionStart;t.setRangeText('    ',s,t.selectionEnd,'end');t.dispatchEvent(new Event('input',{bubbles:true}))}
if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();$('#q')?.focus()}if(e.key==='Escape')document.querySelector('.ov')?.remove();
if((e.key==='Enter')&&e.target.closest?.('.row')&&e.target.classList.contains('row'))e.target.click()});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;if(a!=='open'&&a!=='folder'&&a!=='go')e.stopPropagation();
if(a==='go')go(el.dataset.n);else if(a==='menu')$('#sb').classList.toggle('open');else if(a==='newp')openPform(null,view.n==='folder'?view.id:S.folders[0]?.id);
else if(a==='open'){if(!e.target.closest('[data-a="bm"]'))go('open',id)}else if(a==='folder')go('folder',id);
else if(a==='editp')openPform(byId(id));else if(a==='delp')confirmBox('This problem and its notes will be permanently deleted.',()=>{const p=byId(id);S.problems=S.problems.filter(x=>x.id!==id);save();toast('Problem deleted');go('folder',p.folder)});
else if(a==='bm'){const p=byId(id);p.bm=p.bm?0:1;save();render();toast(p.bm?'Bookmarked':'Bookmark removed')}
else if(a==='df'){df=el.dataset.d;render()}else if(a==='newf')fform();else if(a==='renf')fform(S.folders.find(f=>f.id===id));
else if(a==='delf'){const c=S.problems.filter(p=>p.folder===id).length;confirmBox(c?`This folder and its ${c} problems will be permanently deleted.`:'This folder will be permanently deleted.',()=>{S.folders=S.folders.filter(f=>f.id!==id);S.problems=S.problems.filter(p=>p.folder!==id);save();toast('Folder deleted');go('patterns')})}
else if(a==='status'){const p=byId(id);p.status=el.dataset.s;(p.history=p.history||[]).push({s:p.status,t:Date.now()});save();const y=$('#main').scrollTop;render();$('#main').scrollTop=y;toast('Revision status saved')}
else if(a==='copy'){const p=byId(view.id),v=el.dataset.path.split('.').reduce((o,k)=>o?.[k],p)?.code||'';(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Code copied'),()=>{const t=el.closest('.sec').querySelector(`[data-f="${el.dataset.path}.code"]`);t.select();toast('Selected. Press Ctrl+C to copy')})}
else if(a==='export'){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='dsa-vault-backup.json';l.click();toast('Backup exported')}
else if(a==='import'){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>i.files[0].text().then(t=>{try{const d=JSON.parse(t);if(!d.folders||!d.problems)throw 0;confirmBox('Importing replaces everything currently in the vault.',()=>{S=d;save();theme();toast('Backup restored');go('dash')})}catch(x){toast('That file is not a valid backup')}});i.click()}
else if(a==='logout'){sb.auth.signOut();localStorage.removeItem(KEY);location.reload()}else if(a==='reset')confirmBox('All folders and problems will be erased. Export a backup first.',()=>{if(sb){S.problems=[];S.folders=PAT.map((n,i)=>({id:'f'+i,name:n}));save();setTimeout(()=>location.reload(),1200)}else{localStorage.removeItem(KEY);location.reload()}})});
let dr=null;document.addEventListener('dragstart',e=>{const r=e.target.closest?.('.row');if(r){dr=r.dataset.id;r.classList.add('drag')}});
document.addEventListener('dragend',()=>{dr=null;document.querySelectorAll('.drag,.over').forEach(x=>x.classList.remove('drag','over'))});
document.addEventListener('dragover',e=>{if(!dr)return;const t=e.target.closest('.row,[data-a="folder"]');if(t){e.preventDefault();document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));t.classList.add('over')}});
document.addEventListener('drop',e=>{if(!dr)return;const t=e.target.closest('.row,[data-a="folder"]');if(!t)return;e.preventDefault();const p=byId(dr);
if(t.dataset.a==='folder'){p.folder=t.dataset.id;toast('Moved to '+fname(p.folder))}else if(t.dataset.id!==dr){S.problems=S.problems.filter(x=>x!==p);S.problems.splice(S.problems.findIndex(x=>x.id===t.dataset.id),0,p);toast('Order saved')}save();render()});
function authUI(note){const o=document.createElement('div');o.className='ov';o.style.background='var(--bg)';o.innerHTML=`<div class="md" style="max-width:380px"><div class="logo" style="padding-left:0"><b>DV</b>DSA Vault</div><h3>Sign in to your vault</h3><p class="sub" style="margin:4px 0 0">${note||'Your problems sync to your account.'}</p><form id="af"><label>Email</label><input class="f" name="e" type="email" required autocomplete="email"><label>Password</label><input class="f" name="p" type="password" minlength="6" required autocomplete="current-password"><div class="ma" style="justify-content:stretch"><button type="button" class="btn o" id="su" style="flex:1;justify-content:center">Create account</button><button class="btn" style="flex:1;justify-content:center">Sign in</button></div></form></div>`;document.body.append(o);
const run=async up=>{const f=o.querySelector('#af');if(!f.reportValidity())return;const c={email:f.e.value,password:f.p.value};const{data,error}=up?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);if(error)return toast(error.message);if(!data.session)return toast('Check your email to confirm, then sign in');o.remove();await start(data.session.user)};
o.querySelector('#af').onsubmit=e=>{e.preventDefault();run(0)};o.querySelector('#su').onclick=()=>run(1)}
async function start(u){user=u;const{data}=await sb.from('vault').select('data').eq('user_id',u.id).maybeSingle();
if(data&&data.data&&data.data.folders)S=data.data;else await sb.from('vault').upsert({user_id:u.id,data:S});
try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}theme();render();setStat('Synced')}
async function boot(){theme();if(!sb){render();return}const{data}=await sb.auth.getSession();if(data.session)await start(data.session.user);else{render();authUI()}}
boot();
</script></body></html>
